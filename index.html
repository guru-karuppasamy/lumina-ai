
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA - Master the Why</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Oxanium:wght@300;400;500;600;700;800&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'logo': ['Syncopate', 'sans-serif'],
                        'tech': ['Oxanium', 'sans-serif'],
                        'sans': ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'scan': 'scan 2s linear infinite',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        scan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.5s ease; overflow-x: hidden; }
        .glass-effect {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
        }
        .dark .glass-effect {
            background: #0f172a;
            border: 2px solid #1e293b;
        }
        
        .blob {
         position: fixed;
         width: 45vw;
         height: 60vh;
         z-index: -1;
         filter: blur(60px);
         background: #1d29d4;
         opacity: 0.95;
         transition: all 0.5s ease;
        }

        .blob-left {
            top: -5%;
            left: -15%;
            border-radius: 0% 100% 100% 0% / 0% 50% 50% 100%;
        }

        .blob-right {
            bottom: -5%;
            right: -15%;
            border-radius: 100% 0% 0% 100% / 50% 0% 100% 50%;
        }

        .dark .blob {
            background: #1e1b4b;
            opacity: 0.4;
            filter: blur(80px);
        }

        /* ENHANCED METALLIC LOGO TEXT */
        .metallic-text {
            background: linear-gradient(
                to bottom,
                #3a3a3a 0%,
                #6a6a6a 45%,
                #ffffff 50%,
                #6a6a6a 55%,
                #1a1a1a 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
            letter-spacing: -0.05em;
        }
        
        .robot-logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .robot-icon-svg {
            filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.7));
        }

        .btn-glow {
            box-shadow: 0 10px 30px rgba(29, 41, 212, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-glow:hover {
            box-shadow: 0 15px 40px rgba(29, 41, 212, 0.7);
            transform: translateY(-1px);
        }
        .btn-glow:active {
            transform: translateY(1px);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: #e2e8f0; 
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb { 
            background: #1e293b; 
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <div class="blob blob-left"></div>
    <div class="blob blob-right"></div>

    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
